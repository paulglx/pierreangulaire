<!doctype html>
<html lang="en" class="h-full scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pierreangulaire · playground</title>
  </head>
  <body class="flex h-full flex-col bg-stone-950 font-mono text-xs leading-snug text-stone-50">
    <header class="flex flex-wrap items-center gap-4 px-4 py-3">
      <h1 class="m-0 font-normal text-stone-400">pierreangulaire</h1>
      <label
        id="folder-label"
        class="cursor-pointer rounded p-1 text-stone-400 hover:bg-stone-800"
        title="Open DICOM folder"
      >
        <input id="folder" class="hidden" type="file" webkitdirectory multiple />
      </label>
      <div id="primary-tools" class="flex items-center gap-1">
        <span class="text-stone-400">Left click:</span>
      </div>
      <button
        id="kebab"
        class="cursor-pointer rounded p-1 text-stone-400 hover:bg-stone-800"
        type="button"
        title="Kebab mode"
      ></button>
      <button
        id="reset"
        class="cursor-pointer rounded p-1 text-stone-400 hover:bg-stone-800"
        type="button"
        title="Reset cameras"
      ></button>
      <div class="flex items-center gap-1">
        <span class="text-stone-400">Segments:</span>
        <button
          id="segments-50"
          class="cursor-pointer rounded p-1 text-stone-400 hover:bg-stone-800"
          type="button"
          title="Add 50 segments"
        ></button>
        <button
          id="segments-1000"
          class="cursor-pointer rounded p-1 text-stone-400 hover:bg-stone-800"
          type="button"
          title="Add 1000 segments"
        ></button>
      </div>
      <button
        id="antialiasing"
        class="cursor-pointer rounded p-1 text-stone-400 hover:bg-stone-800"
        type="button"
        title="Antialiasing"
      ></button>
      <button
        id="debug-view"
        class="cursor-pointer rounded p-1 text-stone-400 hover:bg-stone-800"
        type="button"
        title="Debug view"
      ></button>
      <div id="global-controls" class="flex items-center gap-4"></div>
      <div id="status" class="ml-auto text-stone-400 tabular-nums"></div>
    </header>
    <main class="grid min-h-0 flex-1 grid-cols-3 gap-1.5 p-1.5">
      <div class="relative min-h-0 overflow-hidden bg-black">
        <span
          class="pointer-events-none absolute top-2 left-2.5 tracking-widest text-stone-400 uppercase"
          >Axial</span
        >
        <span
          id="axial-time"
          class="pointer-events-none absolute top-2 right-2.5 text-stone-400 tabular-nums"
        ></span>
        <canvas id="axial" class="absolute inset-0 block h-full w-full"></canvas>
      </div>
      <div class="relative min-h-0 overflow-hidden bg-black">
        <span
          class="pointer-events-none absolute top-2 left-2.5 tracking-widest text-stone-400 uppercase"
          >Coronal</span
        >
        <span
          id="coronal-time"
          class="pointer-events-none absolute top-2 right-2.5 text-stone-400 tabular-nums"
        ></span>
        <canvas id="coronal" class="absolute inset-0 block h-full w-full"></canvas>
      </div>
      <div class="relative min-h-0 overflow-hidden bg-black">
        <span
          class="pointer-events-none absolute top-2 left-2.5 tracking-widest text-stone-400 uppercase"
          >Sagittal</span
        >
        <span
          id="sagittal-time"
          class="pointer-events-none absolute top-2 right-2.5 text-stone-400 tabular-nums"
        ></span>
        <canvas id="sagittal" class="absolute inset-0 block h-full w-full"></canvas>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
