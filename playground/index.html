<!doctype html>
<html lang="en" class="h-full scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pierreangulaire · playground</title>
  </head>
  <body class="flex h-full flex-col bg-stone-950 font-mono text-xs leading-snug text-stone-50">
    <header class="flex items-center gap-4 px-4 py-3">
      <h1 class="m-0 font-normal text-stone-400">pierreangulaire · playground</h1>
      <label class="cursor-pointer hover:underline">
        Open DICOM folder
        <input id="folder" class="hidden" type="file" webkitdirectory multiple />
      </label>
      <label class="cursor-pointer hover:underline">
        Open files
        <input id="files" class="hidden" type="file" multiple />
      </label>
      <button id="kebab" class="cursor-pointer text-stone-400 hover:underline" type="button">
        Kebab mode: off
      </button>
      <div id="status" class="ml-auto text-stone-400 tabular-nums">
        Select a folder of DICOM files representing one volume.
      </div>
    </header>
    <main class="grid min-h-0 flex-1 grid-cols-3 gap-1.5 p-1.5">
      <div class="relative min-h-0 overflow-hidden bg-black">
        <span
          class="pointer-events-none absolute top-2 left-2.5 tracking-widest text-stone-400 uppercase"
          >Axial</span
        >
        <canvas id="axial" class="absolute inset-0 block h-full w-full"></canvas>
      </div>
      <div class="relative min-h-0 overflow-hidden bg-black">
        <span
          class="pointer-events-none absolute top-2 left-2.5 tracking-widest text-stone-400 uppercase"
          >Coronal</span
        >
        <canvas id="coronal" class="absolute inset-0 block h-full w-full"></canvas>
      </div>
      <div class="relative min-h-0 overflow-hidden bg-black">
        <span
          class="pointer-events-none absolute top-2 left-2.5 tracking-widest text-stone-400 uppercase"
          >Sagittal</span
        >
        <canvas id="sagittal" class="absolute inset-0 block h-full w-full"></canvas>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
